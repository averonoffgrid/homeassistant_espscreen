# TEST WARSZTATOWY — WAVESHARE / NOCTE
# Baza: ostatni profil kalibracyjny (st7701s, FT6336U 0x48, BL_EN OFF przy 0%).
# Tylko dwa parametry zmienione względem bazy:
#   1) GPIO6 LEDC: 150Hz -> 1220Hz
#   2) Kompensacja gamma 2.8 -> ok. 1.0 w istniejacym template output
# Min_power pozostaje 0.0. Wszystkie diagnostyczne suwaki i przyciski zachowane.
# WAZNE: nie zmienia sposobu inicjalizacji LCD. Kompiluj tylko showroom.yaml.
# UWAGA: po kompensacji gamma jasnosc 5% MOZE WZROSNAC — to test, nie naprawa.

# TEST PRECYZYJNY PWM GPIO6 (0.0-10.0%, krok 0.1%).
# Potwierdzone: BL_EN poprzez PCA9554 P1 fizycznie wygasza podswietlenie.
# W tym pliku jedyna zmiana bazowego PWM to min_power 0.01 -> 0.0.
# Dodatkowa encja pozwala sprawdzic poziomy PWM 0-10 z krokiem 0.1%.
# Uwaga: jest to test skalowania podswietlenia, nie docelowa krzywa.
# Przyciskiem "Showroom PWM przywroc Tessera" przywroc zwykle sterowanie.

# DIAGNOSTYKA PWM (bez ingerencji w dzialajacy LCD, dotyk i kolory).
# TEST BL_EN potwierdzony: podswietlenie gasnie calkowicie.
# Dodane w tym wariancie: odczyt poziomu otrzymywanego z Tessera,
# trzy przyciski bezposredniego testu GPIO6 i przycisk przywrocenia.
# W TYM tescie czestotliwosc to 1220Hz, min_power=0.0.
# Mapowanie GPIO6 i polaryzacja PWM pozostaja bez zmian.
# Skompiluj wylacznie glowny showroom.yaml, ktory includuje local.

# Tessera / ESPHome 2026.9.0: Waveshare ESP32-S3-LCD-Driver-Board N8R8
# MATRYCA ZE ZDJECIA: TL040WVS03CT-H1263A, 480x480, ST7701S, FT6336U
# WAZNE: to PELNY plik showroom.local.yaml. Dolacz go TYLKO RAZ w showroom.yaml.
# Zastap CALA wczesniejsza zawartosc showroom.local.yaml, nie dopisuj ponizej.
# Waveshare: sprawdzona inwersja PWM GPIO6 + BEZPOSREDNIE BL_EN przy 0%.
# Dotyk FT6336U pod potwierdzonym adresem I2C 0x48; odpytywanie co 30ms.
# Sekwencja ST7701S / porch: Adafruit Qualia dla TL040WVS03 4" 480x480.
# GPIO: Waveshare ESP32-S3-LCD-Driver-Board, 40-pin RGB.

substitutions:
  BOARD_ID: "guition" # pozostaw zgodnie z identyfikatorem utworzonego ekranu Tessera
  PANEL_W: "480"
  PANEL_H: "480"
  DISPLAY_DPI: "170"
  GRID_COLS: "2"
  GRID_ROWS: "3"
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"
  LVGL_BUFFER_SIZE: "25%"
  BACKLIGHT_FREQUENCY: "1220Hz"
  # Lokalny override: Nocte OFF musi utrzymac 0% takze po odswiezeniu Tessera.
  # Sleep korzysta ze standardowej jasnosci czuwania ustawionej w Tessera.
  APPLY_BACKLIGHT: |-
    const bool nocte_forced_off = id(nocte_presence_switch).state &&
                                  id(nocte_screen_mode) == 3 &&
                                  !id(alert_active) && !id(calibration_active);
    id(set_backlight).execute(nocte_forced_off ? 0 : level,
                              id(display_dimmed) ? 1500 : 200);

# Korekta gamma bez redefiniowania swiatla Tessera.
# back_light pozostaje w oryginalnym pakiecie; gamma jest kompensowana
# dopiero na wyjsciu PWM (ponizej), bez dodatkowego light i bez !extend.

esp32:
  flash_size: 8MB

logger:
  tx_buffer_size: 2048
  hardware_uart: UART0

spi:
  id: lcd
  clk_pin: GPIO2
  mosi_pin: GPIO1
  interface: spi3

i2c:
  id: touch_bus
  sda: GPIO15
  scl: GPIO7
  frequency: 100kHz  # wspolna magistrala: dotyk + PCA9554 + SHT30 + VL53L0X
  timeout: 10ms      # ogranicza czas oczekiwania na transfer I2C w ESP-IDF
  scan: true

pca9554:
  - id: waveshare_io
    address: 0x20
    i2c_id: touch_bus

globals:
  - id: waveshare_pwm_from_tessera
    type: float
    restore_value: no
    initial_value: '-1.0'
  - id: nocte_sht_temp_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: nocte_sht_humidity_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: nocte_tof_sample_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: nocte_tof_distance_cm
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: nocte_target_near
    type: bool
    restore_value: no
    initial_value: 'false'
  # Strefa: 0=brak odczytu, 1=Wake, 2=Sleep, 3=poza drugim progiem.
  - id: nocte_target_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: nocte_candidate_zone
    type: int
    restore_value: no
    initial_value: '0'
  - id: nocte_candidate_count
    type: int
    restore_value: no
    initial_value: '0'
  # Tryb wymuszony: 0=Tessera, 1=Wake, 2=Sleep, 3=OFF.
  - id: nocte_screen_mode
    type: int
    restore_value: no
    initial_value: '0'
  # Odliczanie do OFF po opuszczeniu Wake lub Sleep.
  - id: nocte_off_since_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: nocte_manual_grace_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: nocte_auto_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'

# Podswietlenie Waveshare: EXIO2/P1 to fizyczne EN przetwornicy LED.
# W odroznieniu od poprzedniego power_supply, ten profil steruje EN
# bezposrednio przy kazdej aktualizacji poziomu jasnosci z Tessera.
# Template zachowuje ID wymagane przez Tessera: gpio_backlight_pwm.
# PRZED WGRANIEM: sprawdz walidacje w Tessera. Wersja testowa.
output:
  - platform: gpio
    id: waveshare_bl_enable
    pin:
      pca9554: waveshare_io
      number: 1                 # EXIO2 / BL_EN / AP3032 EN, HIGH = wlaczone

  - platform: ledc
    id: waveshare_pwm_raw
    pin:
      number: GPIO6
      inverted: true           # Zachowujemy sprawdzona regulacje jasnosci
    frequency: ${BACKLIGHT_FREQUENCY}
    min_power: 0.0  # Bez sztucznego minimum: test zakresu 0-10%
    zero_means_zero: true

  - platform: template
    id: gpio_backlight_pwm     # Tego ID uzywa Tessera
    type: float
    write_action:
      - lambda: |-
          // state w zakresie 0..1 z wewnetrznego swiatla Tessera.
          // Minimalne poziomy < 0.01% traktujemy jako OFF, na wypadek
          // zaokraglen gamma/transition.
          id(waveshare_pwm_from_tessera) = state * 100.0f;
          // Pokazuje, czy suwak Tessera dociera do wyjscia PWM.
          static int logged_bucket = -1;
          const int bucket = static_cast<int>(state * 20.0f); // 5-procentowe przedzialy
          if (bucket != logged_bucket) {
            logged_bucket = bucket;
            ESP_LOGI("bl_waveshare", "PWM z Tessera = %.3f%%", state * 100.0f);
          }
          // Tessera/ESPHome generuje tu poziom po domyslnej korekcji gamma 2.8.
          // Kompensacja potegowa przywraca w przyblizeniu liniowe sterowanie (gamma 1.0)
          // bez dotykania wspolnego 'back_light' z pakietu Tessera.
          const float linear_level = state <= 0.0f ? 0.0f : powf(state, 1.0f / 2.8f);
          if (state <= 0.0001f) {
            id(waveshare_pwm_raw).set_level(0.0f);
            id(waveshare_bl_enable).turn_off();
            ESP_LOGD("bl_waveshare", "OFF: BL_EN=0, level=%.6f", state);
          } else {
            id(waveshare_pwm_raw).set_level(linear_level);
            id(waveshare_bl_enable).turn_on();
            ESP_LOGD("bl_waveshare", "ON: BL_EN=1, gamma_in=%.6f, pwm_out=%.6f", state, linear_level);
          }

# Dokumentacja TL040WVS03CT-H1263A: FT6336U, nie GT911!
touchscreen:
  - platform: ft63x6
    id: ts_touch
    i2c_id: touch_bus
    address: 0x48  # POTWIERDZONE przez odczyt ID=0x40 (64)
    display: my_display
    # Brak interrupt_pin: test odpytywania FT6336U bez IRQ GPIO16.
    reset_pin:
      pca9554: waveshare_io
      number: 0       # EXIO1, J2 pin 38 (TP_RESET)
    update_interval: 30ms
    on_touch:
      - lambda: |-
          ESP_LOGI("touch_diag", "DOTYK x=%d y=%d, raw=%d/%d", touch.x, touch.y, touch.x_raw, touch.y_raw);
    on_release:
      - lambda: |-
          ESP_LOGI("touch_diag", "DOTYK zwolniony");
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480

# Podswietlenie jest sterowane przez template output i BL_EN (EXIO2).
display:
  - platform: st7701s
    id: my_display
    dimensions:
      width: 480
      height: 480
    spi_id: lcd
    spi_mode: MODE3
    data_rate: 1MHz
    color_order: RGB
    invert_colors: true  # specyficzna komenda ST7701S 0x21 w sekwencji Adafruit
    cs_pin: GPIO42
    reset_pin:
      pca9554: waveshare_io
      number: 2       # EXIO3, J2 pin 6 (RESET)
    de_pin: GPIO40
    hsync_pin: GPIO38
    vsync_pin: GPIO39
    pclk_pin: GPIO41
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 50
    hsync_pulse_width: 2
    hsync_back_porch: 44
    vsync_front_porch: 16
    vsync_pulse_width: 2
    vsync_back_porch: 18
    # Init dedykowany TL040WVS03, a NIE 2.8" Waveshare / GT911.
    init_sequence:
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0D, 0x02]
      - [0xC2, 0x31, 0x05]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x18, 0x0E, 0x11, 0x06, 0x07, 0x08, 0x07, 0x22, 0x04, 0x12, 0x0F, 0xAA, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x19, 0x0E, 0x12, 0x07, 0x08, 0x08, 0x08, 0x22, 0x04, 0x11, 0x11, 0xA9, 0x32, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x60]
      - [0xB1, 0x32]
      - [0xB2, 0x07]
      - [0xB3, 0x80]
      - [0xB5, 0x49]
      - [0xB7, 0x85]
      - [0xB8, 0x21]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xE0, 0x00, 0x1B, 0x02]
      - [0xE1, 0x08, 0xA0, 0x00, 0x00, 0x07, 0xA0, 0x00, 0x00, 0x00, 0x44, 0x44]
      - [0xE2, 0x11, 0x11, 0x44, 0x44, 0xED, 0xA0, 0x00, 0x00, 0xEC, 0xA0, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0A, 0xE9, 0xD8, 0xA0, 0x0C, 0xEB, 0xD8, 0xA0, 0x0E, 0xED, 0xD8, 0xA0, 0x10, 0xEF, 0xD8, 0xA0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x09, 0xE8, 0xD8, 0xA0, 0x0B, 0xEA, 0xD8, 0xA0, 0x0D, 0xEC, 0xD8, 0xA0, 0x0F, 0xEE, 0xD8, 0xA0]
      - [0xEB, 0x02, 0x00, 0xE4, 0xE4, 0x88, 0x00, 0x40]
      - [0xEC, 0x3C, 0x00]
      - [0xED, 0xAB, 0x89, 0x76, 0x54, 0x02, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x20, 0x45, 0x67, 0x98, 0xBA]
      - [0x36, 0x00]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xE5, 0xE4]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x3A, 0x66]
      - [0x21]
      - delay 10ms
      - [0x11]
      - delay 120ms
      - [0x29]
    # PHY Waveshare: 16-bit RGB565. Matryca obsluguje 18-bit RGB666,
    # ale Waveshare nie podlacza najmniej znaczacych B0 i R0.
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    update_interval: never
    auto_clear_enabled: false

# Diagnostyka dostepna nawet po uruchomieniu sieci Wi-Fi.
# Bez nowych identyfikatorow sprzetowych - brak konfliktow z Tessera.
# Te dwie encje pojawia sie w Home Assistant po wgraniu firmware.
text_sensor:
  - platform: template
    id: showroom_i2c_scan_result
    name: "Showroom I2C wszystkie adresy"
    entity_category: diagnostic
    icon: mdi:magnify-scan
    update_interval: never

  - platform: template
    id: waveshare_touch_i2c_status
    name: "Showroom FT6336U I2C"
    entity_category: diagnostic
    icon: mdi:gesture-tap
    update_interval: 15s
    lambda: |-
      // Diagnostyka FT6336U: standardowy 0x38 i alternatywny 0x48.
      // Sterownik dotyku ma adres 0x48; dodatkowo sprawdzamy oba adresy diagnostycznie.
      uint8_t reg = 0xA3;
      uint8_t chip38 = 0;
      uint8_t chip48 = 0;
      auto err38 = id(touch_bus).write_readv(0x38, &reg, 1, &chip38, 1);
      auto err48 = id(touch_bus).write_readv(0x48, &reg, 1, &chip48, 1);
      ESP_LOGI("touch_diag", "Probe FT63x6: 0x38=%d ID=0x%02X; 0x48=%d ID=0x%02X",
               (int)err38, chip38, (int)err48, chip48);
      char buf[95];
      if (err38 == i2c::ERROR_OK && err48 == i2c::ERROR_OK) {
        snprintf(buf, sizeof(buf), "0x38 OK ID=%02X; 0x48 OK ID=%02X", chip38, chip48);
      } else if (err38 == i2c::ERROR_OK) {
        snprintf(buf, sizeof(buf), "0x38 OK ID=%02X; 0x48 brak (%d)", chip38, (int)err48);
      } else if (err48 == i2c::ERROR_OK) {
        snprintf(buf, sizeof(buf), "0x38 brak (%d); 0x48 OK ID=%02X", (int)err38, chip48);
      } else {
        snprintf(buf, sizeof(buf), "0x38 brak (%d); 0x48 brak (%d)", (int)err38, (int)err48);
      }
      return {std::string(buf)};
  - platform: template
    id: waveshare_expander_i2c_status
    name: "Showroom PCA9554 I2C"
    entity_category: diagnostic
    icon: mdi:chip
    update_interval: 30s
    lambda: |-
      uint8_t reg = 0x00;  // PCA9554: rejestr wejsc, tylko odczyt
      uint8_t value = 0;
      const auto err = id(touch_bus).write_readv(0x20, &reg, 1, &value, 1);
      if (err != i2c::ERROR_OK) {
        ESP_LOGW("touch_diag", "PCA9554 0x20: brak odpowiedzi I2C, blad=%d", (int) err);
        return {"Brak odpowiedzi 0x20 (blad " + std::to_string((int) err) + ")"};
      }
      ESP_LOGI("touch_diag", "PCA9554 0x20: odpowiedz I2C");
      return {"OK 0x20"};

  - platform: template
    id: nocte_distance_zone
    name: "Nocte Strefa odleglosci"
    icon: mdi:map-marker-distance
    update_interval: 1s
    lambda: |-
      if (!id(nocte_tof_responds).state) return {"Brak komunikacji I2C"};
      if (id(nocte_tof_sample_last_ms) == 0 ||
          (uint32_t)(millis() - id(nocte_tof_sample_last_ms)) > 4000UL)
        return {"Brak nowych odczytow"};
      if (id(nocte_target_zone) == 1) return {"Do Odleglosc 1 (Wake)"};
      if (id(nocte_target_zone) == 2) return {"Odleglosc 1-2 (Sleep)"};
      if (id(nocte_target_zone) == 3) return {"Za Odleglosc 2 (OFF timer)"};
      return {"Ustalanie strefy"};

  - platform: template
    id: nocte_screen_state
    name: "Nocte Tryb ekranu"
    icon: mdi:monitor
    update_interval: 1s
    lambda: |-
      if (!id(nocte_presence_switch).state) return {"Tessera / automat OFF"};
      if (id(nocte_screen_mode) == 3) return {"OFF - podswietlenie 0%"};
      if (id(nocte_screen_mode) == 2) return {"Sleep"};
      if (id(nocte_screen_mode) == 1) return {"Wake"};
      return {"Oczekiwanie na pomiar"};

  - platform: template
    id: nocte_presence_status
    name: "Nocte Stan automatyki"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      if (!id(nocte_presence_switch).state) return {"Wylaczona"};
      if (!id(nocte_tof_responds).state) return {"Blad komunikacji VL53L0X"};
      if (id(nocte_tof_sample_last_ms) == 0 ||
          (uint32_t)(millis() - id(nocte_tof_sample_last_ms)) > 4000UL)
        return {"Brak swiezych danych - bez zmian trybu"};
      if (id(nocte_screen_mode) == 3) return {"OFF - podswietlenie wylaczone"};
      if (id(nocte_target_zone) == 1) return {"Wake - strefa 1"};
      if (id(nocte_target_zone) == 2) return {"Sleep - strefa 2 (bez OFF)"};
      if (id(nocte_target_zone) == 3) return {"Sleep - odliczanie OFF"};
      return {"Ustalanie strefy"};

# Wartość na WEJŚCIU template-output po korekcji gamma Tessera.
# Nie jest to pomiar fizycznego duty ani luminancji LCD.
sensor:
  - platform: template
    id: waveshare_pwm_from_tessera_sensor
    name: "Showroom PWM otrzymane z Tessera"
    entity_category: diagnostic
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      if (id(waveshare_pwm_from_tessera) < 0.0f) return NAN;
      return id(waveshare_pwm_from_tessera);

  # Pomiar SHT30 - standardowe adresy 0x44 / 0x45 (uzywamy 0x44).
  # Odczyty z bledami staja sie niedostepne, a nie zamrozone na starej wartosci.
  - platform: sht3xd
    i2c_id: touch_bus
    address: 0x44
    update_interval: 20s
    temperature:
      id: nocte_temperature
      name: "Nocte Temperatura"
      filters:
        - timeout: 60s
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(nocte_sht_temp_last_ms) = millis();
    humidity:
      id: nocte_humidity
      name: "Nocte Wilgotnosc"
      filters:
        - timeout: 60s
      on_value:
        then:
          - lambda: |-
              if (std::isfinite(x)) id(nocte_sht_humidity_last_ms) = millis();

  # Wewnętrzny odczyt w metrach. Do HA trafia wynik w centymetrach ponizej.
  # Brak celu (NaN) jest stanem normalnym; nie jest to blad komunikacji I2C.
  - platform: vl53l0x
    id: nocte_tof_raw
    internal: true
    i2c_id: touch_bus
    address: 0x29
    update_interval: 750ms
    timing_budget: 33000us
    timeout: 50ms
    long_range: false
    on_value:
      then:
        - lambda: |-
            id(nocte_tof_sample_last_ms) = millis();
            id(nocte_tof_distance_cm) =
                (std::isfinite(x) && x >= 0.04f && x <= 2.0f) ? x * 100.0f : NAN;

  - platform: template
    id: nocte_distance_cm
    name: "Nocte Odleglosc"
    icon: mdi:ruler
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 1s
    lambda: |-
      if (!id(nocte_tof_responds).state ||
          id(nocte_tof_sample_last_ms) == 0 ||
          (uint32_t)(millis() - id(nocte_tof_sample_last_ms)) > 4000UL)
        return NAN;
      return id(nocte_tof_distance_cm);

  - platform: template
    id: nocte_time_to_off
    name: "Nocte Czas do wygaszenia"
    icon: mdi:timer-sand
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(nocte_presence_switch).state || !id(nocte_tof_fresh).state) return NAN;
      if (id(nocte_screen_mode) == 3) return 0.0f;
      if (id(nocte_target_zone) != 3 || id(nocte_off_since_ms) == 0) return NAN;
      const float elapsed_s = (uint32_t)(millis() - id(nocte_off_since_ms)) / 1000.0f;
      return std::max(0.0f, id(nocte_off_delay).state - elapsed_s);

# Precyzyjna regulacja testowa GPIO6: omija gamma i suwak Tessera.
# 0% zawsze fizycznie wylacza przetwornice przez BL_EN.
number:
  - platform: template
    id: waveshare_pwm_fine_test
    name: "Showroom TEST precyzyjny PWM GPIO6"
    entity_category: diagnostic
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 0
    max_value: 10
    step: 0.1
    mode: slider
    optimistic: true
    restore_value: false
    initial_value: 5
    set_action:
      - lambda: |-
          const float pct = std::max(0.0f, std::min(10.0f, (float)x));
          if (pct < 0.01f) {
            id(waveshare_pwm_raw).set_level(0.0f);
            id(waveshare_bl_enable).turn_off();
          } else {
            id(waveshare_bl_enable).turn_on();
            id(waveshare_pwm_raw).set_level(pct * 0.01f);
          }
          ESP_LOGI("bl_waveshare", "Fine PWM: %.1f%% (BL_EN %s)", pct, pct < 0.01f ? "OFF" : "ON");

  - platform: template
    id: nocte_activation_distance
    name: "Nocte Odleglosc 1"
    icon: mdi:map-marker-distance
    unit_of_measurement: "cm"
    min_value: 20
    max_value: 150
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 80

  - platform: template
    id: nocte_distance_2
    name: "Nocte Odleglosc 2"
    icon: mdi:map-marker-distance
    unit_of_measurement: "cm"
    min_value: 30
    max_value: 200
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 140

  - platform: template
    id: nocte_off_delay
    name: "Nocte Opoznienie wygaszenia"
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 5
    max_value: 300
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 30

# Pełny skan dostępnych adresów 7-bitowych I2C na żądanie z HA.
# Odpowiedź w encji tekstowej "Showroom I2C wszystkie adresy".
# Test fizycznego BL_EN: uruchamiaj przy jasnosci ok. 50%.
# W trakcie testu ekran zgasnie na 3 sekundy.
button:
  # Testy omijaja suwak Tessera. Nie testowac przy 0% jasnosci, gdyz
  # poziomy 10/50/90% ustawiaja GPIO6 bezposrednio i trzymaja BL_EN=ON.
  - platform: template
    id: waveshare_pwm_test_10
    name: "Showroom TEST GPIO6 PWM 10%"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(waveshare_bl_enable).turn_on();
          id(waveshare_pwm_raw).set_level(0.10f);
          ESP_LOGI("bl_waveshare", "TEST bezposredni GPIO6 PWM=10%%");

  - platform: template
    id: waveshare_pwm_test_50
    name: "Showroom TEST GPIO6 PWM 50%"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(waveshare_bl_enable).turn_on();
          id(waveshare_pwm_raw).set_level(0.50f);
          ESP_LOGI("bl_waveshare", "TEST bezposredni GPIO6 PWM=50%%");

  - platform: template
    id: waveshare_pwm_test_90
    name: "Showroom TEST GPIO6 PWM 90%"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(waveshare_bl_enable).turn_on();
          id(waveshare_pwm_raw).set_level(0.90f);
          ESP_LOGI("bl_waveshare", "TEST bezposredni GPIO6 PWM=90%%");

  - platform: template
    id: waveshare_pwm_restore
    name: "Showroom PWM przywroc Tessera"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // Zrodlo tej formuly: OTA_BACKLIGHT w features/backlight.yaml Tessera.
          const float v = screen_settings::current.brightness / 100.0f;
          id(gpio_backlight_pwm).set_level(powf(v, id(back_light)->get_gamma_correct()));
          ESP_LOGI("bl_waveshare", "Przywrocono PWM ze stanu normal brightness=%d%%",
                   (int)screen_settings::current.brightness);

  - platform: template
    id: waveshare_bl_en_test
    name: "Showroom TEST BL_EN 3s"
    entity_category: diagnostic
    on_press:
      - output.turn_off: waveshare_bl_enable
      - delay: 3s
      - output.turn_on: waveshare_bl_enable

  - platform: template
    id: showroom_i2c_scan_button
    name: "Showroom Skanuj I2C"
    entity_category: diagnostic
    icon: mdi:magnify-scan
    on_press:
      - lambda: |-
          std::string found;
          unsigned int count = 0;
          for (uint8_t addr = 0x08; addr <= 0x77; ++addr) {
            const auto err = id(touch_bus).write_readv(addr, nullptr, 0, nullptr, 0);
            if (err == i2c::ERROR_OK) {
              char hex[8];
              snprintf(hex, sizeof(hex), "0x%02X ", addr);
              found += hex;
              ++count;
              ESP_LOGI("i2c_scan", "ACK: 0x%02X", addr);
            }
          }
          if (count == 0) found = "Brak odpowiedzi I2C";
          ESP_LOGI("i2c_scan", "Znaleziono %u: %s", count, found.c_str());
          id(showroom_i2c_scan_result).publish_state(found);

# NOCTE SHT30 + VL53L0X / automatyka dziala na ESP32-S3 bez Home Assistant.
# Nie wykonujemy transakcji I2C w lambdach binary_sensor (wykonywanych w petli).
# Odpytywanie I2C tylko co 10 s; brak odpowiedzi nie uruchamia petli oczekiwania.
binary_sensor:
  - platform: template
    id: nocte_sht_responds
    name: "Nocte SHT30 odpowiada"
    icon: mdi:thermometer-check
    entity_category: diagnostic

  - platform: template
    id: nocte_tof_responds
    name: "Nocte VL53L0X odpowiada"
    icon: mdi:radar
    entity_category: diagnostic

  - platform: template
    id: nocte_sht_fresh
    name: "Nocte SHT30 pomiary aktualne"
    entity_category: diagnostic
    icon: mdi:check-network
    lambda: |-
      const uint32_t now = millis();
      return id(nocte_sht_responds).state &&
             id(nocte_sht_temp_last_ms) != 0 && id(nocte_sht_humidity_last_ms) != 0 &&
             (uint32_t)(now - id(nocte_sht_temp_last_ms)) < 60000UL &&
             (uint32_t)(now - id(nocte_sht_humidity_last_ms)) < 60000UL;

  - platform: template
    id: nocte_tof_fresh
    name: "Nocte VL53L0X pomiary aktualne"
    entity_category: diagnostic
    icon: mdi:check-network
    lambda: |-
      return id(nocte_tof_responds).state &&
             id(nocte_tof_sample_last_ms) != 0 &&
             (uint32_t)(millis() - id(nocte_tof_sample_last_ms)) <= 4000UL;

  - platform: template
    id: nocte_person_present
    name: "Nocte Obiekt przed panelem"
    device_class: occupancy
    icon: mdi:account-eye
    lambda: |-
      if (!id(nocte_tof_fresh).state) return false;
      return id(nocte_target_near);

switch:
  - platform: template
    id: nocte_presence_switch
    name: "Nocte Automatyczne wybudzanie"
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(nocte_screen_mode) = 0;
          id(nocte_off_since_ms) = 0;
          id(nocte_manual_grace_until_ms) = 0;
          id(nocte_auto_dimmed) = false;
          ESP_LOGI("nocte", "Automatyka ON: prog 1=%.0f cm, prog 2=%.0f cm, OFF po %.0f s",
                   id(nocte_activation_distance).state, id(nocte_distance_2).state,
                   id(nocte_off_delay).state);
    turn_off_action:
      - lambda: |-
          // Oddanie sterowania Tessera; likwidacja wymuszonego BL_EN=0.
          const bool owned = id(nocte_auto_dimmed);
          id(nocte_screen_mode) = 0;
          id(nocte_off_since_ms) = 0;
          id(nocte_manual_grace_until_ms) = 0;
          id(nocte_auto_dimmed) = false;
          id(sleep_requested) = false;
          if (owned && id(display_dimmed)) id(wake_display).execute();
          else id(apply_screen_settings).execute();

interval:
  # Tanie sondowanie magistrali poza petla renderowania LVGL, bez retry/spin.
  # 0xC0 = 0xEE: identyfikator modelu VL53L0X (STMicroelectronics).
  - interval: 10s
    then:
      - lambda: |-
          const auto sht_err = id(touch_bus).write_readv(0x44, nullptr, 0, nullptr, 0);
          id(nocte_sht_responds).publish_state(sht_err == i2c::ERROR_OK);
          uint8_t reg = 0xC0, model = 0;
          const auto tof_err = id(touch_bus).write_readv(0x29, &reg, 1, &model, 1);
          id(nocte_tof_responds).publish_state(tof_err == i2c::ERROR_OK && model == 0xEE);

  # Trzy strefy: <=D1 Wake; D1..D2 Sleep (utrzymanie jasnosci standby);
  # >D2 Sleep, potem OFF po zadanym opoznieniu. Bezposredni skok Wake->>D2
  # uruchamia timer tak samo jak Sleep->>D2. Strefa 2 NIGDY nie uruchamia OFF.
  # Dwa kolejne odczyty potwierdzaja zmiane strefy. Awaria I2C -> bez akcji.
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (!id(nocte_tof_fresh).state) {
            // Fail-safe: uwolnij wymuszone OFF, aby dotyk i Tessera mogly budzic ekran.
            // Nie powtarzaj akcji I2C ani skryptow w petli przy awarii.
            if (id(nocte_screen_mode) != 0) {
              id(nocte_screen_mode) = 0;
              id(nocte_auto_dimmed) = false;
              id(sleep_requested) = false;
              id(apply_screen_settings).execute();
              ESP_LOGW("nocte", "Brak swiezego VL53L0X - oddanie podswietlenia Tessera");
            }
            id(nocte_target_zone) = 0;
            id(nocte_candidate_zone) = 0;
            id(nocte_candidate_count) = 0;
            id(nocte_target_near) = false;
            id(nocte_off_since_ms) = 0;
            return;
          }

          const float cm = id(nocte_tof_distance_cm);
          const float d1 = id(nocte_activation_distance).state;
          // Prog 2 musi byc przynajmniej 10 cm dalej niz prog 1.
          const float d2 = std::max(id(nocte_distance_2).state, d1 + 10.0f);
          // Przy komunikacji I2C OK, NaN = brak celu w zasiegu (strefa 3).
          const int candidate = !std::isfinite(cm) ? 3 : (cm <= d1 ? 1 : (cm <= d2 ? 2 : 3));
          if (candidate != id(nocte_candidate_zone)) {
            id(nocte_candidate_zone) = candidate;
            id(nocte_candidate_count) = 1;
          } else if (id(nocte_candidate_count) < 2) {
            ++id(nocte_candidate_count);
          }
          bool zone_changed = false;
          if (id(nocte_candidate_count) >= 2 && id(nocte_target_zone) != candidate) {
            const int previous_zone = id(nocte_target_zone);
            id(nocte_target_zone) = candidate;
            zone_changed = true;
            id(nocte_manual_grace_until_ms) = 0;
            if (candidate == 3) {
              // Opuszczenie Wake bezposrednio poza D2, opuszczenie Sleep
              // albo pierwsze uruchomienie poza zasiegiem: start odliczania.
              id(nocte_off_since_ms) = now;
            } else {
              // Wake oraz Sleep to strefy OBECNOSCI: nie odliczaj OFF.
              id(nocte_off_since_ms) = 0;
            }
            ESP_LOGI("nocte", "Strefa %d -> %d, dystans=%.1fcm, progi=%.0f/%.0fcm",
                     previous_zone, candidate, cm, d1, d2);
          }
          id(nocte_target_near) = id(nocte_target_zone) == 1;
          if (!id(nocte_presence_switch).state || id(nocte_target_zone) == 0) return;
          // W trakcie alarmu, kalibracji lub dotyku nie przerywaj interakcji.
          if (id(alert_active) || id(calibration_active) || id(touch_down)) return;

          if (id(nocte_target_zone) == 1) {
            id(nocte_manual_grace_until_ms) = 0;
            id(nocte_off_since_ms) = 0;
            id(nocte_screen_mode) = 1;
            id(nocte_auto_dimmed) = false;
            id(last_touch_ms) = now;
            if (id(display_dimmed)) id(wake_display).execute();
            return;
          }

          // Dotyk/HA moze wybudzic panel w Sleep lub OFF. Daj 10 s na obsluge.
          if (id(nocte_screen_mode) >= 2 && !id(display_dimmed)) {
            id(nocte_screen_mode) = 1;
            id(nocte_manual_grace_until_ms) = now + 10000UL;
            if (id(nocte_target_zone) == 3) id(nocte_off_since_ms) = 0;
          }
          if (id(nocte_manual_grace_until_ms) != 0) {
            if ((uint32_t)(now - id(last_touch_ms)) < 1500UL) {
              id(nocte_manual_grace_until_ms) = now + 10000UL;
              if (id(nocte_target_zone) == 3) id(nocte_off_since_ms) = 0;
            }
            if ((int32_t)(now - id(nocte_manual_grace_until_ms)) < 0) return;
            id(nocte_manual_grace_until_ms) = 0;
            // Po recznym wybudzeniu daj pelne zadane opoznienie
            // dopiero po 10 s ochrony, a nie wliczaj do niego czasu dotyku.
            if (id(nocte_target_zone) == 3) id(nocte_off_since_ms) = now;
          }

          // Strefa 2 oraz poczatek strefy 3: zwykly Sleep Tessera.
          if (id(nocte_screen_mode) != 2 && id(nocte_screen_mode) != 3) {
            id(nocte_screen_mode) = 2;
            id(nocte_auto_dimmed) = true;
            id(sleep_requested) = true;
            if (!id(display_dimmed)) id(dim_display).execute();
            else id(apply_screen_settings).execute();
          } else if (id(nocte_target_zone) == 2 && id(nocte_screen_mode) == 3) {
            // Z OFF do Sleep: przywroc jasnosc czuwania i zwolnij BL_EN.
            // Warunek sprawdzany takze bez zmiany strefy, zeby naprawic
            // pozostawiony OFF z poprzedniego firmware.
            id(nocte_screen_mode) = 2;
            id(nocte_auto_dimmed) = true;
            id(nocte_off_since_ms) = 0;
            id(sleep_requested) = true;
            id(apply_screen_settings).execute();
          }

          // Jedynie obecnosc POZA dwiema strefami moze zakonczyc sie OFF.
          if (id(nocte_target_zone) != 3) return;
          if (id(nocte_off_since_ms) == 0) id(nocte_off_since_ms) = now;
          const uint32_t delay_ms = (uint32_t)(id(nocte_off_delay).state * 1000.0f);
          if (id(nocte_screen_mode) != 3 &&
              (uint32_t)(now - id(nocte_off_since_ms)) >= delay_ms) {
            id(nocte_screen_mode) = 3;
            id(nocte_auto_dimmed) = true;
            id(sleep_requested) = true;
            // Output=0 wymusza BL_EN=0; hook APPLY_BACKLIGHT utrzymuje OFF.
            id(set_backlight).execute(0, 250);
            ESP_LOGI("nocte", "OFF po %lu ms poza Odlegloscia 2",
                     (unsigned long)(now - id(nocte_off_since_ms)));
          }
